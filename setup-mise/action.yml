name: Setup Mise
description: Setup Mise environment

inputs:
  persist-credentials:
    description: Whether to configure the token or SSH key with the local git config
    default: 'false'

  fetch-all:
    description: Whether to fetch all history for all branches and tags.
    default: 'false'

  mise-version:
    description: 'Version Spec of the version to use. Examples: 2026.3.10. When the version is not specified, latest is used.'
    default: ''

  debug:
    description: Whether to enable debug logging.
    default: 'false'

  cache-preset:
    description: |-
      Named cache preset(s) to enable. Comma-separated for multiple (e.g. 'nub', 'hk', 'nub,hk').
      Each preset runs as an independent cache step with its own key and path.
      Available presets: 'nub', 'hk'.
    default: ''

  cache-path:
    description: Path to cache via actions/cache. Enables a custom cache step alongside any preset.
    default: ''

  cache-key:
    description: Cache key for the custom cache step. Defaults to runner.os.
    default: ''

  cache-restore-keys:
    description: Restore-keys for the custom cache step. Optional.
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: "${{ inputs.fetch-all == 'true' && '0' || '1' }}"

    - name: Setup mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: ${{ inputs.mise-version }}
        log_level: ${{ inputs.debug == 'true' && 'debug' || 'info' }}
        experimental: true
        cache: true

    - name: Cache Nub
      if: contains(inputs.cache-preset, 'nub')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/nub/store/v1
        key: ${{ format('nub-{0}-{1}', runner.os, hashFiles('nub.lock')) }}

    - name: Cache Hk
      if: contains(inputs.cache-preset, 'hk')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/hk
        key: ${{ format('hk-{0}-{1}', runner.os, hashFiles('hk.pkl')) }}

    - name: Cache Custom
      if: inputs.cache-path != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: custom-${{ inputs.cache-key != '' && inputs.cache-key || runner.os }}
        restore-keys: ${{ inputs.cache-restore-keys }}

    - name: Mise doctor
      if: ${{ inputs.debug }}
      shell: bash
      run: mise doctor
