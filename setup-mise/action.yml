name: Setup Mise
description: Setup Mise environment

inputs:
  persist-credentials:
    description: Whether to configure the token or SSH key with the local git config
    default: 'false'

  fetch-all:
    description: Whether to fetch all history for all branches and tags.
    default: 'false'

  mise-version:
    description: 'Version Spec of the version to use. Examples: 2026.3.10. When the version is not specified, latest is used.'
    default: ''

  debug:
    description: Whether to enable debug logging.
    default: 'false'

  cache-preset:
    description: |-
      Named cache preset(s) to enable. Comma-separated for multiple (e.g. 'nub', 'eslint', 'nub,eslint').
      Each preset runs as an independent cache step with its own key and path.
      Available presets: 'nub', 'mise-task', 'eslint'.
    default: ''

  cache-path:
    description: Path to cache via actions/cache. Enables a custom cache step alongside any preset.
    default: ''

  cache-key:
    description: Cache key for the custom cache step. Defaults to 'custom-<runner.os>'.
    default: ''

  cache-restore-keys:
    description: Restore-keys for the custom cache step. Optional.
    default: ''

  github-token:
    description: GitHub token for API authentication.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: "${{ inputs.fetch-all == 'true' && '0' || '1' }}"

    - name: Setup mise
      uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      env:
        MISE_CACHE_DIR: ~/.cache/mise/
      with:
        version: ${{ inputs.mise-version }}
        minimum_release_age: 7d
        log_level: ${{ inputs.debug == 'true' && 'debug' || 'info' }}
        experimental: true
        cache: true
        github_token: ${{ inputs.github-token }}

    - name: Cache Nub
      if: contains(inputs.cache-preset, 'nub')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/nub/store/v1
        key: ${{ format('nub-{0}-{1}', runner.os, hashFiles('nub.lock')) }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ format('nub-{0}-{1}', runner.os, hashFiles('nub.lock')) }}-${{ github.job }}

    - name: Cache ESLint
      if: contains(inputs.cache-preset, 'eslint')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .eslintcache
        key: ${{ format('eslint-{0}-{1}', runner.os, hashFiles('nub.lock')) }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ format('eslint-{0}-{1}', runner.os, hashFiles('nub.lock')) }}-${{ github.job }}

    - name: Cache Mise task artifacts
      if: contains(inputs.cache-preset, 'mise-task')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/mise/task-artifacts
          ~/.local/state/mise/task-artifacts
          ~/.local/state/mise/task-sources
        key: ${{ format('mise-task-{0}-{1}', runner.os, hashFiles('mise.toml')) }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ format('mise-task-{0}-{1}', runner.os, hashFiles('mise.toml')) }}-${{ github.job }}

    - name: Cache (custom)
      if: inputs.cache-path != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-key != '' && inputs.cache-key || format('custom-{0}', runner.os) }}
        restore-keys: ${{ inputs.cache-restore-keys }}

    - name: Mise doctor
      if: ${{ inputs.debug }}
      shell: bash
      run: mise doctor
