name: Setup Mise
description: Setup Mise environment

inputs:
  persist-credentials:
    description: Whether to configure the token or SSH key with the local git config
    default: 'false'

  fetch-all:
    description: Whether to fetch all history for all branches and tags.
    default: 'false'

  mise-version:
    description: 'Version Spec of the version to use. Examples: 2026.3.10. When the version is not specified, latest is used.'
    default: ''

  debug:
    description: Whether to enable debug logging.
    default: 'false'

  cache-preset:
    description: Named cache preset to enable (e.g. 'nub'). Explicit cache-* inputs override per-field.
    default: ''

  cache-path:
    description: Path to cache via actions/cache. Overrides the preset's path.
    default: ''

  cache-key:
    description: Cache key for actions/cache. Overrides the preset's key.
    default: ''

  cache-restore-keys:
    description: Restore-keys for actions/cache. Overrides the preset's restore-keys.
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: "${{ inputs.fetch-all == 'true' && '0' || '1' }}"

    - name: Setup mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: ${{ inputs.mise-version }}
        log_level: ${{ inputs.debug == 'true' && 'debug' || 'info' }}
        experimental: true
        cache: true

    - name: Cache Nub
      if: inputs.cache-preset == 'nub'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path != '' && inputs.cache-path || '~/.local/share/nub/store/v1' }}
        key: ${{ inputs.cache-key != '' && inputs.cache-key || format('nub-{0}-{1}', runner.os, hashFiles('nub.lock')) }}

    - name: Cache
      if: inputs.cache-preset == '' && inputs.cache-path != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-key != '' && inputs.cache-key || runner.os }}

    - name: Mise doctor
      if: ${{ inputs.debug }}
      shell: bash
      run: mise doctor
