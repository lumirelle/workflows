name: Setup Mise
description: Setup Mise environment

inputs:
  persist-credentials:
    description: Whether to configure the token or SSH key with the local git config
    default: 'false'

  fetch-all:
    description: Whether to fetch all history for all branches and tags.
    default: 'false'

  mise-version:
    description: 'Version Spec of the version to use. Examples: 2026.3.10. When the version is not specified, latest is used.'
    default: ''

  debug:
    description: Whether to enable debug logging.
    default: 'false'

  cache-preset:
    description: |-
      Named cache preset(s) to enable. Comma-separated for multiple (e.g. 'nub', 'hk', 'nub,hk').
      Each preset runs as an independent cache step with its own key and path.
      Available presets: 'mise-task', 'nub'.
      Deprecated presets: 'mise-deps', 'hk'.
    default: ''

  cache-preset-path:
    description: |-
      JSON map to override cache paths per preset.
      Values can be a string or an array of strings for multiple paths.
      Example: '{"mise-task":["/path/a","/path/b"],"nub":"/custom/nub"}'.
      Keys must match enabled presets. Omitted keys use defaults.
    default: ''

  cache-preset-key:
    description: |-
      JSON map to override cache keys per preset.
      Example: '{"mise-task":"mise-task-custom-key","nub":"nub-custom-key"}'.
      Keys must match enabled presets. Omitted keys use defaults.
    default: ''

  cache-preset-restore-keys:
    description: |-
      JSON map to override restore-keys per preset.
      Values can be a string or an array of strings for multiple keys.
      Example: '{"nub":["nub-Linux-","nub-"]}'.
      Keys must match enabled presets. Omitted keys have no restore-keys.
    default: ''

  cache-path:
    description: Path to cache via actions/cache. Enables a custom cache step alongside any preset.
    default: ''

  cache-key:
    description: Cache key for the custom cache step. Defaults to runner.os.
    default: ''

  cache-restore-keys:
    description: Restore-keys for the custom cache step. Optional.
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: "${{ inputs.fetch-all == 'true' && '0' || '1' }}"

    - name: Setup mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      env:
        MISE_CACHE_DIR: ~/.cache/mise/
      with:
        version: ${{ inputs.mise-version }}
        log_level: ${{ inputs.debug == 'true' && 'debug' || 'info' }}
        experimental: true
        cache: true

    - name: Resolve cache config
      if: inputs.cache-preset != ''
      shell: bash
      env:
        CACHE_PRESET: ${{ inputs.cache-preset }}
        CACHE_PRESET_PATH: ${{ inputs.cache-preset-path }}
        CACHE_PRESET_RESTORE_KEYS: ${{ inputs.cache-preset-restore-keys }}
      run: |
        set -euo pipefail

        resolve_json_value() {
          # $1 = json map, $2 = key
          # Outputs the value for the key; if array, joins with newline.
          # Outputs nothing if key is missing.
          jq -r --arg k "$2" '
            .[$k] // empty |
            if type == "array" then join("\n") else . end
          ' <<< "$1" 2>/dev/null
        }

        for preset in mise-deps mise-task nub hk; do
          if [[ "$CACHE_PRESET" != *"$preset"* ]]; then
            continue
          fi

          var_suffix="${preset//-/_}"

          # --- Resolve path ---
          path=""
          if [[ -n "$CACHE_PRESET_PATH" ]]; then
            path=$(resolve_json_value "$CACHE_PRESET_PATH" "$preset")
          fi
          if [[ -z "$path" ]]; then
            case "$preset" in
              mise-deps)
                path="$HOME/.local/state/mise/deps" ;;
              mise-task)
                path="$HOME/.cache/mise/task-artifacts"$'\n'"$HOME/.local/state/mise/task-artifacts"$'\n'"$HOME/.local/state/mise/task-sources" ;;
              nub)
                path="$HOME/.local/share/nub/store/v1" ;;
              hk)
                path="$HOME/.cache/hk" ;;
            esac
          fi
          {
            echo "PRESET_PATH_${var_suffix}<<EOF"
            printf '%s\n' "$path"
            echo "EOF"
          } >> "$GITHUB_ENV"

          # --- Resolve restore-keys ---
          rkeys=""
          if [[ -n "$CACHE_PRESET_RESTORE_KEYS" ]]; then
            rkeys=$(resolve_json_value "$CACHE_PRESET_RESTORE_KEYS" "$preset")
          fi
          {
            echo "PRESET_RESTORE_KEYS_${var_suffix}<<EOF"
            printf '%s\n' "$rkeys"
            echo "EOF"
          } >> "$GITHUB_ENV"
        done

    - name: Cache mise deps (deprecated, remove in next major version)
      if: contains(inputs.cache-preset, 'mise-deps')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PRESET_PATH_mise_deps }}
        key: ${{ inputs.cache-preset-key != '' && fromJSON(inputs.cache-preset-key).mise-deps || format('mise-deps-{0}-{1}', runner.os, hashFiles('mise.toml')) }}
        restore-keys: ${{ env.PRESET_RESTORE_KEYS_mise_deps }}

    - name: Cache mise task artifacts
      if: contains(inputs.cache-preset, 'mise-task')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PRESET_PATH_mise_task }}
        key: ${{ inputs.cache-preset-key != '' && fromJSON(inputs.cache-preset-key).mise-task || format('mise-task-{0}-{1}', runner.os, hashFiles('mise.toml')) }}
        restore-keys: ${{ env.PRESET_RESTORE_KEYS_mise_task }}

    - name: Cache nub
      if: contains(inputs.cache-preset, 'nub')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PRESET_PATH_nub }}
        key: ${{ inputs.cache-preset-key != '' && fromJSON(inputs.cache-preset-key).nub || format('nub-{0}-{1}', runner.os, hashFiles('nub.lock')) }}
        restore-keys: ${{ env.PRESET_RESTORE_KEYS_nub }}

    - name: Cache hk (deprecated, remove in next major version)
      if: contains(inputs.cache-preset, 'hk')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PRESET_PATH_hk }}
        key: ${{ inputs.cache-preset-key != '' && fromJSON(inputs.cache-preset-key).hk || format('hk-{0}-{1}', runner.os, hashFiles('hk.pkl')) }}
        restore-keys: ${{ env.PRESET_RESTORE_KEYS_hk }}

    - name: Cache (custom)
      if: inputs.cache-path != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: custom-${{ inputs.cache-key != '' && inputs.cache-key || runner.os }}
        restore-keys: ${{ inputs.cache-restore-keys }}

    - name: Mise doctor
      if: ${{ inputs.debug }}
      shell: bash
      run: mise doctor
