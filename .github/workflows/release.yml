name: Release

on:
  workflow_call:
    inputs:
      primary-os:
        required: false
        type: string
        default: ubuntu-latest

      cache-preset:
        required: false
        type: string
        default: ''

      debug:
        required: false
        type: boolean
        default: false

      changelog:
        required: false
        type: string
        default: mise run changelog

      build:
        required: false
        type: string
        default: mise run build

      publish:
        required: false
        type: string
        default: mise run publish

jobs:
  release:
    runs-on: ${{ inputs.primary-os }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Setup mise
        id: setup-mise
        uses: lumirelle/workflows/setup-mise@v10
        with:
          fetch-all: true
          cache-preset: ${{ inputs.cache-preset }}
          debug: ${{ inputs.debug }}

      - name: Generate changelog
        if: ${{ inputs.changelog != '' }}
        run: ${{ inputs.changelog }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ${{ inputs.build }}

      - name: Publish
        run: ${{ inputs.publish }}
