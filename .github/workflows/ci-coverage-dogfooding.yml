name: CI Coverage Dogfooding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  coverage:
    uses: lumirelle/workflows/.github/workflows/ci-coverage.yml@main
    permissions:
      id-token: write
    with:
      cache-preset: 'mise-deps,mise-task,nub,hk'
      debug: true
