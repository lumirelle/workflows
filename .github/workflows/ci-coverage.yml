name: CI Coverage

on:
  workflow_call:
    inputs:
      primary-os:
        required: false
        type: string
        default: ubuntu-slim

      cache-preset:
        required: false
        type: string
        default: ''

      cache-preset-path:
        required: false
        type: string
        default: ''

      cache-preset-key:
        required: false
        type: string
        default: ''

      cache-preset-restore-keys:
        required: false
        type: string
        default: ''

      cache-path:
        required: false
        type: string
        default: ''

      cache-key:
        required: false
        type: string
        default: ''

      cache-restore-keys:
        required: false
        type: string
        default: ''

      test:
        required: false
        type: string
        default: mise run test --coverage

      debug:
        required: false
        type: boolean
        default: false

jobs:
  coverage:
    if: ${{ inputs.test != '' }}
    runs-on: ${{ inputs.primary-os }}
    permissions:
      id-token: write
    steps:
      - name: Setup mise
        uses: lumirelle/workflows/setup-mise@v10
        with:
          cache-preset: ${{ inputs.cache-preset }}
          cache-preset-path: ${{ inputs.cache-preset-path }}
          cache-preset-key: ${{ inputs.cache-preset-key }}
          cache-preset-restore-keys: ${{ inputs.cache-preset-restore-keys }}
          cache-path: ${{ inputs.cache-path }}
          cache-key: ${{ inputs.cache-key }}
          cache-restore-keys: ${{ inputs.cache-restore-keys }}
          debug: ${{ inputs.debug }}

      - name: Test
        run: ${{ inputs.test }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
