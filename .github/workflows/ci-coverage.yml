name: CI Coverage

on:
  workflow_call:
    inputs:
      primary-os:
        required: false
        type: string
        default: ubuntu-slim

      cache-preset:
        required: false
        type: string
        default: ''

      cache-preset-path:
        required: false
        type: string
        default: ''

      cache-preset-key:
        required: false
        type: string
        default: ''

      cache-preset-restore-keys:
        required: false
        type: string
        default: ''

      cache-path:
        required: false
        type: string
        default: ''

      cache-key:
        required: false
        type: string
        default: ''

      cache-restore-keys:
        required: false
        type: string
        default: ''

      test:
        required: false
        type: string
        default: mise run test --coverage

      debug:
        required: false
        type: boolean
        default: false

jobs:
  coverage:
    runs-on: ${{ inputs.primary-os }}
    permissions:
      id-token: write
    steps:
      - name: Setup mise
        uses: lumirelle/workflows/setup-mise@v10
        with:
          cache-preset: ${{ inputs.cache-preset }}
          cache-preset-path: ${{ inputs.cache-preset-path }}
          cache-preset-key: ${{ inputs.cache-preset-key }}
          cache-preset-restore-keys: ${{ inputs.cache-preset-restore-keys }}
          cache-path: ${{ inputs.cache-path }}
          cache-key: ${{ inputs.cache-key }}
          cache-restore-keys: ${{ inputs.cache-restore-keys }}
          debug: ${{ inputs.debug }}

      - name: Test
        run: ${{ inputs.test }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
